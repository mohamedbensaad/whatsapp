name: WhatsApp Reply Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # كل 5 دقائق
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run reply bot
        run: node reply.js

      - name: Save session + replied
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add session/session-main || true
          git add replied.json || true
          git add memory.json || true
          git commit -m "reply update $(date +%F-%T)" || echo "No changes"
          git push
